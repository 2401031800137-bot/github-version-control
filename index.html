<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Workflow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #24292f;
        }

        .workflow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .step {
            background: white;
            padding: 20px;
            width: 150px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .step h2 {
            font-size: 20px;
        }

        .arrow {
            font-size: 30px;
            color: #555;
        }

        footer {
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>GitHub Workflow 🚀</h1>
    <p>Simple GitHub development workflow</p>

    <div class="workflow">

        <div class="step">
            <h2>1️⃣ Code</h2>
            <p>Write Code</p>
        </div>

        <div class="arrow">→</div>

        <div class="step">
            <h2>2️⃣ Commit</h2>
            <p>Save Changes</p>
        </div>

        <div class="arrow">→</div>

        <div class="step">
            <h2>3️⃣ Push</h2>
            <p>Upload to GitHub</p>
        </div>

        <div class="arrow">→</div>

        <div class="step">
            <h2>4️⃣ Actions</h2>
            <p>Run Workflow</p>
        </div>

        <div class="arrow">→</div>

        <div class="step">
            <h2>5️⃣ Deploy</h2>
            <p>Website Live</p>
        </div>

    </div>

    <footer>
        <p>Code → Commit → Push → GitHub Actions → Deploy</p>
    </footer>

</body>
</html>
